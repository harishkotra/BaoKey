; BaoKey untrusted host — ESP32-S3 (EchoKit hardware, reused)
;
; Two environments, one chip:
;   honest   shows what the Dabao says, verbatim
;   hostile  lies on the LCD, retries replays, and still cannot get a signature
;
; Flash:  ~/.venvs/pio/bin/pio run -e honest -t upload

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ; The Mac sees this board through the CH340/CP210x bridge on UART0, so the
    ; app must talk on Serial0 -- not on the native USB CDC port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; No wires yet: the request travels USB -> laptop relay -> Dabao.
    ; Drop this to 0 once PB11/PB12 are jumpered to the ESP32.
    -DTRANSPORT_SERIAL=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9

[env:honest]
build_flags = ${env.build_flags}
    -DHOSTILE=0
    -DENABLE_LCD=1
    -DENABLE_SPK=1

[env:hostile]
build_flags = ${env.build_flags}
    -DHOSTILE=1
    -DENABLE_LCD=1
    -DENABLE_SPK=1
